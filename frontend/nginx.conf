# Who gets the server-rendered preview instead of the app.
#
# A chat client, a messenger or a search engine fetching a shared link runs no
# JavaScript: it reads the `og:` tags out of the HTML and stops. The app is a
# Vue route, so what such a fetch would get from this build is the empty shell
# -- the same title for every plot anybody ever shared. Those callers go to the
# backend's /geteilt route instead, which renders the plot's name and points at
# a card drawn server-side.
#
# Sniffing the user agent is what it looks like, and it is the only signal
# there is: a preview bot announces itself and nothing else about the request
# distinguishes it. The failure modes are both mild and neither is silent for
# long -- a bot missing from this list gets the app's shell and shows no
# preview, exactly as before this existed, and a browser mistaken for a bot
# gets a real page with the plot's name, its card and a link into the app.
map $http_user_agent $preview_bot {
  default 0;
  "~*(facebookexternalhit|facebookcatalog|WhatsApp|Twitterbot|Slackbot|Slack-ImgProxy|Discordbot|TelegramBot|LinkedInBot|SkypeUriPreview|Googlebot|bingbot|DuckDuckBot|Applebot|redditbot|Mastodon|Pleroma|Synapse|Iframely|Embedly|vkShare|Yahoo Link Preview|nuzzel|Bluesky|SignalBot|Quora Link Preview)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;
  gzip_min_length 1024;

  # Hashed filenames: the name changes when the content does.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API travels through the same origin, which is why nothing here needs
  # CORS: the browser only ever talks to this server.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Extraction fetches a page and then asks a model about it; the frontend
    # itself waits three minutes before giving up.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  # A shared plot: the app for a person, the backend's rendering for a preview
  # bot. `if` is dependable with `return` and little else, which is why this
  # branches into a named location rather than carrying a proxy_pass of its own.
  location /geteilt/ {
    error_page 418 = @vorschau;
    if ($preview_bot) { return 418; }
    try_files $uri /index.html;
  }

  location @vorschau {
    proxy_pass http://backend:8000;
    # `$http_host`, not `$host`: this is the one route that writes absolute
    # URLs back out, and `$host` drops the port. On the compose default
    # (localhost:8080) every og:url and og:image would then name port 80 --
    # a preview that points at a server nobody is running.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The app routes in history mode, so an unknown path is a page, not a file.
  # A path naming a file extension stays a 404 — a missing asset must not come
  # back as index.html and be reported as a syntax error.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
