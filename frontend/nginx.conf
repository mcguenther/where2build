server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;
  gzip_min_length 1024;

  # Hashed filenames: the name changes when the content does.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API travels through the same origin, which is why nothing here needs
  # CORS: the browser only ever talks to this server.
  location /api/ {
    proxy_pass http://backend:8000;
    # A page handed over by the bookmarklet is the whole document, and the
    # endpoint accepts 3 000 000 characters of it. nginx defaults to 1 MB and
    # answers 413 above it, which arrives as a failed read with no reason.
    client_max_body_size 8m;
    # `$http_host`, not `$host`: `$host` drops the port, and one route here
    # writes absolute URLs back out (the og: tags of a shared plot). On the
    # compose default, localhost:8080, every one of them would name port 80 --
    # a preview pointing at a server nobody is running.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Extraction fetches a page and then asks a model about it; the frontend
    # itself waits three minutes before giving up.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  # A shared plot. The page is the app, the same one everybody else gets --
  # only the head gains the plot's own og: tags, fetched from the backend and
  # spliced in here. A preview bot runs no JavaScript, so a shared link would
  # otherwise announce itself with the build's own title, the same for every
  # plot ever shared.
  #
  # Done this way there is nothing to recognise: bot or browser, both get the
  # tags. The earlier version sniffed the user agent against a list of known
  # crawlers, which meant a messenger nobody had thought of got nothing.
  #
  # `rewrite ... break` rather than `try_files`: try_files re-enters location
  # matching, lands in `location /`, and SSI is off there -- the include then
  # ships to the client as a literal comment, which looks exactly like a
  # feature that was never wired up.
  location ~ ^/geteilt/(?<token>[A-Za-z0-9_-]+) {
    ssi on;
    rewrite ^ /index.html break;
  }

  # The app routes in history mode, so an unknown path is a page, not a file.
  # A path naming a file extension stays a 404 — a missing asset must not come
  # back as index.html and be reported as a syntax error.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
