# Routing against the public Transitous instead of the router in this stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.transitous.yml up --build
#
# For a machine that cannot spare the 5.6 GiB the first MOTIS import peaks at,
# or the ~4 GB of disk the inputs and the graph take. Naming this file is the
# whole switch: it points the backend at Transitous *and* keeps the three
# routing services from starting, so there is no variable to forget and no
# router that runs and is not asked.
#
# Transitous is a volunteer service. Its policy asks for a way of contact
# (APP_CONTACT in backend/.env), counts routing as resource-intensive and rules
# out commercial use -- docs/research/routing-motis.md § 6. Fine for trying the
# app out, not for handing it to other people.
#
# The backend's cache is keyed on the instance, so switching back and forth
# never serves one router's answers as the other's.
services:
  backend:
    environment:
      - MOTIS_BASE_URL=https://api.transitous.org
    depends_on:
      motis:
        condition: service_healthy
        required: false

  indexes:
    depends_on:
      routing-data:
        condition: service_completed_successfully
        required: false

  # Kept out of `up` by a profile nobody names.
  routing-data:
    profiles: ["local-routing"]
  motis-import:
    profiles: ["local-routing"]
  motis:
    profiles: ["local-routing"]
