[project]
name = "where2build-backend"
version = "0.1.0"
description = "Backend for Grundstuecks-Check Sachsen: ALKIS parcels, BORIS land values, MOTIS routing, LLM extraction, WMS tile proxy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyproj>=3.6",
    "shapely>=2.0",
    # The tile proxy scales an oversized WMS render back down to a tile. Not
    # optional any more: without it the cadastral overlay would go to the
    # browser at up to half a megabyte per tile.
    "pillow>=10.0",
    # Server storage for signed-in accounts, and deliberately not an ORM:
    # three tables and a handful of statements, written out in
    # app/services/storage.py. The driver is a plain dependency while the
    # database is not a requirement -- without DATABASE_URL no connection is
    # ever opened and every account route answers 503.
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # The image tests need it; they skip when Tesseract itself is missing.
    "pillow>=10.0",
]
# Only scripts/build_poi_index.py needs this, and only where an OSM extract is
# reachable. The API itself reads the built index with the standard library.
poi = [
    "osmium>=4.0",
]
# Reading a listing's attached cadastral extract. The binary is the real
# dependency (apt install tesseract-ocr tesseract-ocr-deu); Pillow is what
# enlarges an image before it is read, which is the single step the
# measurements say buys the most -- see app/services/ocr.py. Without either,
# /api/parcels/search runs on the listing's text and says so.
ocr = [
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# The schema is applied from the installed package, not from a checkout, and
# the preview card is drawn from fonts that ship with it.
[tool.setuptools.package-data]
app = ["schema.sql", "migrations/*.sql", "assets/fonts/*.woff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
