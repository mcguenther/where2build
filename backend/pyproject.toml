[project]
name = "where2build-backend"
version = "0.1.0"
description = "Backend for Grundstuecks-Check Sachsen: ALKIS parcels, BORIS land values, MOTIS routing, LLM extraction, WMS tile proxy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# Only scripts/build_poi_index.py needs this, and only where an OSM extract is
# reachable. The API itself reads the built index with the standard library.
poi = [
    "osmium>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
