# Two services and no database: the backend is a proxy and a disk cache in
# front of ALKIS, BORIS, MOTIS, the tile servers and the extraction model, and
# everything a user enters lives in their own browser.
#
#   docker compose up --build      then open http://localhost:8080
services:
  backend:
    build:
      context: ./backend
    # Optional: without it every value falls back to the default in
    # backend/.env.example, and page extraction stays off for want of a key.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Declared without a value: compose passes it through only when it is set
      # on the host, and leaves it unset otherwise -- so backend/.env and the
      # built-in default (Transitous) keep their say when nobody asks for
      # anything else. Point it at the local router with
      # `MOTIS_BASE_URL=http://motis:8080 docker compose --profile local-routing up`.
      - MOTIS_BASE_URL
    volumes:
      # Answers from the official services, kept between restarts. Losing it
      # costs time and other people's bandwidth, not correctness.
      - backend-cache:/cache
      # A built OpenStreetMap directory, if there is one. Read-only: the
      # backend only ever reads it. Absent, /api/nearby says so for those
      # categories instead of answering with an empty list.
      - ./backend/data:/app/data:ro
    healthcheck:
      # No curl in the slim image, and adding one for this would be the only
      # reason to have it.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${WHERE2BUILD_PORT:-8080}:80"
    # nginx resolves `backend` once at startup, so it has to be answering by
    # then — otherwise the container exits and the app looks broken.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional: routing on this machine instead of Transitous ---------------
  #
  # Off unless asked for. api.transitous.org is a volunteer service whose policy
  # asks to be contacted before "many requests" and calls routing itself
  # resource-intensive (docs/research/routing-motis.md § 6), so anything past a
  # prototype should bring its own router.
  #
  #   ./motis/fetch-data.sh                                     # ~350 MB + extract
  #   MOTIS_BASE_URL=http://motis:8080 \
  #     docker compose --profile local-routing up --build
  #
  # The first start imports and takes a few minutes; after that the built graph
  # lives in `motis-graph` and the server is ready in seconds.

  # One-shot: turns the OSM extract and the GTFS feed into the graph MOTIS
  # serves. `motis server` never reads the inputs again, only /data.
  motis-import:
    profiles: ["local-routing"]
    image: ghcr.io/motis-project/motis:2.11.2
    volumes:
      - ./motis/data-input:/data-input:ro
      # Not inside /data-input: docker cannot create a mountpoint inside a
      # read-only bind.
      - ./motis/config.yml:/config.yml:ro
      - motis-graph:/data
    # Re-importing an unchanged graph costs minutes and buys nothing, so the
    # import is skipped once it has succeeded. Delete the volume to force it.
    command: >
      /bin/sh -c "if [ -f /data/meta/import_done ]; then
        echo 'Graph already built — delete the motis-graph volume to reimport.';
      else
        /motis import -d /data -c /config.yml && touch /data/meta/import_done;
      fi"
    restart: "no"

  motis:
    profiles: ["local-routing"]
    image: ghcr.io/motis-project/motis:2.11.2
    depends_on:
      motis-import:
        condition: service_completed_successfully
    volumes:
      - motis-graph:/data
    command: ["/motis", "server", "-d", "/data"]
    healthcheck:
      # busybox wget; the geocoder only answers once the address index is
      # mapped, so this is a real readiness check and not just an open port.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/geocode?text=Leipzig"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Recurring jobs. Opt-in like the routing, so `docker compose up` stays the
  # two services it has always been:
  #     docker compose --profile scheduled-jobs up -d
  #     docker compose exec scheduler python scripts/run_jobs.py list
  #     docker compose exec scheduler python scripts/run_jobs.py run cache-sweep
  # Same image as the backend, so there is nothing extra to build and the job
  # scripts are the ones already shipped. No Docker socket: every job here runs
  # in this container against the shared volumes, and mounting the socket would
  # hand it root on the host for the sake of four timed commands.
  scheduler:
    profiles: ["scheduled-jobs"]
    build:
      context: ./backend
    command: ["python", "scripts/run_jobs.py", "serve"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - JOBS_FILE=/ops/jobs.json
    volumes:
      - backend-cache:/cache
      # Writable, unlike the backend's mount: rebuilding an index is the job.
      - ./backend/data:/app/data
      - ./ops:/ops:ro
      - scheduler-state:/state
    restart: unless-stopped

volumes:
  backend-cache:
  scheduler-state:
  # The built routing graph. Only exists when the local-routing profile has run.
  motis-graph:
