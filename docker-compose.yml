# The whole app, ready to use: nginx serves the build and proxies /api, the
# backend proxies and caches the official services, Postgres holds what a
# signed-in person stores, and authentik is the identity provider that makes
# signing in -- and registering -- possible at all.
#
#   docker compose up --build      then open http://localhost:8080
#
# There is no demo account, because there is a „Konto anlegen" link on the
# sign-in page and it works: the first visit creates a real account in the
# local authentik. The administrator (http://localhost:9000/if/admin/) is
# `akadmin` with the password below.
#
# The database and the provider are here because without them a third of the
# app is unreachable -- no account, no server storage, no shared link, and a
# „Teilen" button that can only explain why it does nothing. Both are
# deliberately local: the credentials are in this committed file, the
# provider is reachable only from this machine, and everything names
# localhost. A deployment replaces them; see README, "Signing in".
#
# authentik is a real identity provider and takes about a minute to come up
# the first time -- it applies its own database schema and the blueprint in
# ops/authentik/. Until it answers, „Anmelden" leads to a page that is not
# there yet.
# The project name, spelled out rather than taken from the directory. Compose
# derives it from the folder otherwise, so a clone in `where2build-2` becomes a
# second stack with its own containers and its own volumes, and
# `--remove-orphans` in one no longer sees the other's leftovers.
name: where2build

services:
  backend:
    build:
      context: ./backend
    # Optional: without it every value falls back to the default in
    # backend/.env.example, and page extraction stays off for want of a key.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Pinned here, not left to the image: `environment` outranks `env_file`,
      # and the Dockerfile's `ENV` does not. backend/.env is a copy of
      # .env.example, whose `APP_CACHE_DIR=.cache` is right for a checkout and
      # wrong in here -- measured 25.09.2026, it sent every write to a
      # directory the unprivileged user may not create, the volume at /cache
      # stayed empty, and every tile, parcel and land value went out again on
      # every request.
      - APP_CACHE_DIR=/cache
      # The database in this stack. A deployment sets its own DATABASE_URL --
      # this one is reachable from nowhere but the compose network.
      - DATABASE_URL=postgresql://where2build:where2build@db:5432/where2build
      # Sign-in against the provider below. The issuer is the address the
      # *browser* uses; OIDC_INTERNAL_BASE_URL is the origin this container
      # reaches the same provider at, because "localhost" in here is this
      # container.
      - OIDC_ISSUER=http://localhost:9000/application/o/where2build/
      - OIDC_INTERNAL_BASE_URL=http://authentik:9000
      - OIDC_CLIENT_ID=where2build
      - OIDC_CLIENT_SECRET=nur-fuer-den-lokalen-stapel
      # Signs the session cookie. A shipped one is a key everybody has, which
      # is exactly why this stack is for a laptop and not for a server.
      - OIDC_SESSION_SECRET=nur-fuer-den-lokalen-stapel-nicht-verwenden
      - OIDC_PUBLIC_BASE_URL=http://localhost:8080
      # http on localhost: a Secure cookie would never be sent back.
      - OIDC_COOKIE_SECURE=false
      # Declared without a value: compose passes it through only when it is set
      # on the host, and leaves it unset otherwise -- so backend/.env and the
      # built-in default (Transitous) keep their say when nobody asks for
      # anything else. docker-compose.local-routing.yml sets it for the router
      # that runs here, so it never has to be typed.
      - MOTIS_BASE_URL
      # Exactly one reverse proxy of ours stands in front here: the frontend
      # container's nginx, which sends `X-Forwarded-For
      # $proxy_add_x_forwarded_for`. Without this the request budget would
      # count every signed-out caller against nginx's own container address --
      # one shared budget for all of them, which is the opposite of what it is
      # for. With it, the rightmost entry is the peer nginx actually saw and
      # everything left of it is text the caller wrote.
      - APP_PROXY_HOPS=1
      # The job list and the price list both live in ops/, mounted below.
      - JOBS_FILE=/ops/jobs.json
      - LLM_PRICES_PATH=/ops/llm-preise.json
    volumes:
      # Answers from the official services, kept between restarts. Losing it
      # costs time and other people's bandwidth, not correctness.
      - backend-cache:/cache
      # A built OpenStreetMap directory, if there is one. Read-only: the
      # backend only ever reads it. Absent, /api/nearby says so for those
      # categories instead of answering with an empty list.
      - ./backend/data:/app/data:ro
      # The job list and the model price list, read-only: the backend shows
      # them and never writes them. Refreshing the prices is a job, and jobs
      # run in the scheduler.
      - ./ops:/ops:ro
      # The scheduler's records, shared. The administration area reads them to
      # say when a job last ran, and writes a request into the same directory
      # when somebody presses „Jetzt starten" -- which is why this one is not
      # read-only. Without the scheduler profile the directory is simply empty
      # and the page says nothing is there to pick a request up.
      - scheduler-state:/state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl in the slim image, and adding one for this would be the only
      # reason to have it.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=where2build
      - POSTGRES_PASSWORD=where2build
      - POSTGRES_DB=where2build
    volumes:
      # Plots and shared links survive a restart; `docker compose down -v`
      # is what throws them away.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The backend applies its schema at start-up, so it must not start
      # before this answers -- and `pg_isready` answers before the first
      # initialisation is finished, hence the start period.
      test: ["CMD-SHELL", "pg_isready -U where2build -d where2build"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # authentik needs a database of its own, and this stack already runs a
  # Postgres. One short-lived container creates it if it is not there, which
  # also covers a volume from before authentik existed -- an init script under
  # docker-entrypoint-initdb.d would not, because that runs once ever.
  authentik-db-init:
    image: postgres:16-alpine
    environment:
      - PGPASSWORD=where2build
    entrypoint:
      - sh
      - -c
      - >
        psql -h db -U where2build -tc "select 1 from pg_database where datname = 'authentik'"
        | grep -q 1 || psql -h db -U where2build -c "create database authentik"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # authentik keeps its sessions and its task queue here.
  authentik-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The identity provider. On its own port, not behind the nginx below:
  # authentik serves from the root of its origin (/if/, /application/,
  # /static/ and an /api/ of its own) and has no setting for a sub-path, so
  # sharing one origin with this app would collide on /api.
  #
  # The browser reaches it as http://localhost:9000, the backend as
  # http://authentik:9000 -- see OIDC_INTERNAL_BASE_URL above.
  authentik: &authentik
    image: ghcr.io/goauthentik/server:2025.2.4
    command: server
    environment: &authentik-env
      # Signs authentik's own sessions. Committed on purpose, like everything
      # else in this stack, and the first thing a deployment replaces.
      - AUTHENTIK_SECRET_KEY=nur-fuer-den-lokalen-stapel-nicht-verwenden
      - AUTHENTIK_POSTGRESQL__HOST=db
      - AUTHENTIK_POSTGRESQL__USER=where2build
      - AUTHENTIK_POSTGRESQL__PASSWORD=where2build
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_REDIS__HOST=authentik-cache
      # The administrator, so the stack is usable without a first-run wizard.
      - AUTHENTIK_BOOTSTRAP_PASSWORD=wo-bauen-verwaltung
      - AUTHENTIK_BOOTSTRAP_EMAIL=admin@where2build.example
      # Nothing about this machine goes anywhere.
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      - AUTHENTIK_AVATARS=initials
    volumes: &authentik-volumes
      # Applied at start-up: the provider, the application, the enrollment
      # flow and German as the language.
      - ./ops/authentik:/blueprints/custom:ro
      - authentik-media:/media
      # The mark the sign-in page shows; the blueprint points the brand at it.
      - ./frontend/public/favicon.svg:/media/where2build.svg:ro
    depends_on:
      db:
        condition: service_healthy
      authentik-db-init:
        condition: service_completed_successfully
      authentik-cache:
        condition: service_healthy
    ports:
      - "${WHERE2BUILD_AUTH_PORT:-9000}:9000"
    restart: unless-stopped

  # The other half of authentik: it applies the blueprint and runs the
  # background tasks. Same image, same configuration, no port.
  authentik-worker:
    <<: *authentik
    command: worker
    environment: *authentik-env
    volumes: *authentik-volumes
    ports: []

  frontend:
    build:
      context: ./frontend
    ports:
      - "${WHERE2BUILD_PORT:-8080}:80"
    # nginx resolves `backend` once at startup, so it has to be answering by
    # then — otherwise the container exits and the app looks broken.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Routing on this machine instead of Transitous lives in its own file, so
  # naming that file is the whole opt-in and there is no variable to forget:
  #
  #   ./motis/fetch-data.sh
  #   docker compose -f docker-compose.yml -f docker-compose.local-routing.yml up --build

  # Recurring jobs. Opt-in like the routing, so `docker compose up` stays the
  # two services it has always been:
  #     docker compose --profile scheduled-jobs up -d
  #     docker compose exec scheduler python scripts/run_jobs.py list
  #     docker compose exec scheduler python scripts/run_jobs.py run cache-sweep
  # Same image as the backend, so there is nothing extra to build and the job
  # scripts are the ones already shipped. No Docker socket: every job here runs
  # in this container against the shared volumes, and mounting the socket would
  # hand it root on the host for the sake of four timed commands.
  scheduler:
    profiles: ["scheduled-jobs"]
    build:
      context: ./backend
    command: ["python", "scripts/run_jobs.py", "serve"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # See the backend: the cache sweep must look where the backend writes.
      - APP_CACHE_DIR=/cache
      - JOBS_FILE=/ops/jobs.json
    volumes:
      - backend-cache:/cache
      # Writable, unlike the backend's mount: rebuilding an index is the job.
      - ./backend/data:/app/data
      - ./ops:/ops:ro
      - scheduler-state:/state
    restart: unless-stopped

volumes:
  backend-cache:
  scheduler-state:
  db-data:
  authentik-media:
